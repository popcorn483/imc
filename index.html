<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>IMC Hub</title>
<link rel="manifest" href="hub.webmanifest">
<meta name="theme-color" content="#0b0d28">
<link rel="apple-touch-icon" href="hub-apple-180.png">
<link rel="icon" href="hub-192.png">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0b0d28;color:#f4f5ff;font:400 18px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:grid;place-items:center;min-height:100vh;padding:20px;background:radial-gradient(circle at 50% 30%,#1c2258,#0b0d28 70%)}
.box{width:min(440px,100%);background:#141734;border:1px solid #2e3366;border-radius:20px;padding:28px 24px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.box img{width:96px;height:96px}
h1{font-size:24px;margin:10px 0 4px}
p{margin:0 0 18px;color:#c9cdf2;font-size:16px}
label.pw{display:block;text-align:left;font-weight:700;font-size:16px;margin-bottom:6px}
.row{display:flex;gap:8px}
input[type=password],input[type=text]{flex:1;min-width:0;font:inherit;font-size:20px;padding:12px 14px;border-radius:12px;border:2px solid #3a3f7a;background:#0b0d28;color:#fff}
input:focus{outline:none;border-color:#ffc23d}
.show{all:unset;cursor:pointer;padding:0 14px;border-radius:12px;border:2px solid #3a3f7a;font-size:15px;font-weight:700}
.show:focus-visible{outline:3px solid #ffc23d}
.rem{display:flex;gap:10px;align-items:center;justify-content:flex-start;margin:14px 0 18px;font-size:16px;cursor:pointer;text-align:left}
.rem input{width:24px;height:24px;accent-color:#ffc23d;flex:none}
button.go{all:unset;box-sizing:border-box;cursor:pointer;width:100%;padding:14px;border-radius:14px;background:#ffc23d;color:#1a1205;font-weight:800;font-size:19px;text-align:center}
button.go:focus-visible{outline:3px solid #fff;outline-offset:3px}
button.go[disabled]{opacity:.6;cursor:wait}
.msg{min-height:26px;margin-top:12px;font-size:16px;font-weight:600}
.msg.bad{color:#ff8a8a}
.small{font-size:14px;color:#9ea3d6;margin-top:14px}
</style>
</head>
<body>
<form class="box" id="lock" autocomplete="on" hidden>
  <img src="imc-logo.png" alt="IMC">
  <h1>IMC Hub</h1>
  <p>This is private. Type the password to open it.</p>
  <label class="pw" for="pw">Password</label>
  <div class="row"><input type="password" id="pw" name="password" autocomplete="current-password" required><button type="button" class="show" id="show" aria-pressed="false">Show</button></div>
  <label class="rem"><input type="checkbox" id="rem" checked> Remember me on this device</label>
  <button class="go" id="go" type="submit">Open</button>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>
  <div class="small">Untick "Remember me" on a shared computer.</div>
</form>

function b64(s){var b=atob(s.replace(/\s+/g,"")),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function tob64(buf){var u=new Uint8Array(buf),s="";for(var i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)}
function get(st){try{return st.getItem(KEY)}catch(e){return null}}
function put(st,v){try{st.setItem(KEY,v)}catch(e){}}
function drop(){try{localStorage.removeItem(KEY)}catch(e){}try{sessionStorage.removeItem(KEY)}catch(e){}}
function show(msg,bad){var f=$("lock");f.hidden=false;var m=$("msg");m.textContent=msg||"";m.className="msg"+(bad?" bad":"");if(!msg)setTimeout(function(){$("pw").focus()},50)}
if(!window.crypto||!crypto.subtle||!window.DecompressionStream){show("This browser is too old to open this page. Please use an up-to-date Chrome, Edge or Safari.",true);$("go").disabled=true;return}
async function derive(pw){var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALT),iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"])}
async function open(key){var all=b64($("imc-sealed").textContent),iv=all.subarray(0,12),ct=all.subarray(12);
  var plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,ct);
  var html=await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  document.open();document.write(html);document.close()}
async function fromStore(){var raw=get(localStorage)||get(sessionStorage);if(!raw)return false;
  try{var k=await crypto.subtle.importKey("raw",b64(raw),{name:"AES-GCM"},true,["decrypt"]);await open(k);return true}catch(e){drop();return false}}
$("show").onclick=function(){var p=$("pw"),on=p.type==="password";p.type=on?"text":"password";this.textContent=on?"Hide":"Show";this.setAttribute("aria-pressed",on)};
$("lock").addEventListener("submit",async function(e){e.preventDefault();var pw=$("pw").value;if(!pw)return;$("go").disabled=true;show("Opening… this can take a few seconds the first time.");
  try{var k=await derive(pw);var raw=tob64(await crypto.subtle.exportKey("raw",k));
    try{await crypto.subtle.decrypt({name:"AES-GCM",iv:b64($("imc-sealed").textContent).subarray(0,12)},k,b64($("imc-sealed").textContent).subarray(12))}catch(err){$("go").disabled=false;show("That password isn't right. Please try again.",true);$("pw").select();return}
    put(sessionStorage,raw);if($("rem").checked)put(localStorage,raw);await open(k)}
  catch(err){$("go").disabled=false;show("Sorry, it didn't open. Please try again.",true)}});
fromStore().then(function(ok){if(!ok)show("")});
})();
</script>
