<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IMC Foyer Trailers</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Playfair+Display:wght@700&family=Figtree:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Full-screen foyer player for TVs. It loops: showtimes card → trailer → next film, with a "Now showing" departures board,
   promo slides and welcome videos in between, and a live strip along the bottom with the clock, the next show and a ticker.
   Everything is sized from the screen, so it works on any TV, landscape or portrait. */
:root{--ink:#fff;--muted:#b9c3e6;--gold:#ffd84a;--amber:#f39a2b;--red:#e2452e;--green:#46d17a;--blue:#1fa0de;--bg:#070a1c;--panel:rgba(255,255,255,.06);--line:rgba(255,255,255,.14);
  --stripe:linear-gradient(90deg,#ffd84a,#f39a2b 55%,#e2452e);--lux:#ffc23d;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--f-body:"Figtree",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,monospace;--strip:9vh;--sx:3.5vw;--sy:3vh}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden;cursor:none}
body.pointer{cursor:default}
#stage{position:fixed;inset:0}
.layer{position:absolute;inset:0 0 calc(var(--strip) + var(--sy)) 0;transition:opacity .9s ease}
body.nostrip .layer{bottom:0}
.layer[hidden]{display:block!important;opacity:0;pointer-events:none}
.layer.full{bottom:0}
#ident{background:#000}#ident canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#yt-wrap{overflow:hidden;background:#000}
/* The trailer is drawn slightly larger than its area, pushed up, so YouTube's title bar sits off the top of the screen
   while the bottom of the picture (subtitles, captions, release dates) stays fully in view above the info strip. */
#yt{position:absolute;top:-9%;left:-4.5%;width:109%;height:109%;border:0;background:#000;pointer-events:none}
#yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;pointer-events:none}
#ytshield{position:absolute;inset:0;z-index:1}
/* YouTube shows its title and "Watch on YouTube" for the first few seconds of a video (and after a jump): the picture is
   zoomed in a little then so they're off the edges, and eases back once they've gone */
#yt{transition:transform 1.4s cubic-bezier(.4,0,.2,1);transform-origin:50% 50%}#yt.zoom{transform:scale(1.32);transition:none}
#ytcurtain{position:absolute;inset:0;z-index:2;background:#000;opacity:1;transition:opacity .5s}
#ytcurtain.off{opacity:0}
#infobox{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;background:rgba(5,7,26,.95);color:#fff;border:2px solid var(--gold,#ffc23d);border-radius:1.6vh;padding:2.4vh 2.6vw;font:500 2vh var(--f-body,sans-serif);max-width:80vw}#infobox b{display:block;font-size:2.8vh;margin-bottom:1.2vh}#infobox td{padding:.5vh 1.2vw .5vh 0;vertical-align:top}#infobox td:first-child{color:#aab3d8;white-space:nowrap}#infobox small{display:block;margin-top:1.4vh;color:#aab3d8}
#soundhint{position:fixed;right:2vw;top:2vh;z-index:9;font:600 1.8vh var(--f-body,sans-serif);background:rgba(0,0,0,.72);color:#fff;padding:1vh 1.2vw;border-radius:1vh}#soundhint[hidden]{display:none}
#svid{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;z-index:1}#svid[hidden]{display:none}
#tlabel{position:absolute;z-index:3;left:3vw;top:3.5vh;display:flex;align-items:center;gap:1.2vw;padding:1.2vh 1.6vw;border-radius:1.2vh;background:rgba(5,7,20,.72);font-family:var(--f-display);font-weight:800;font-size:3.8vh;text-transform:uppercase;letter-spacing:.04em;transition:opacity .6s}
#tlabel small{font:600 2vh var(--f-mono);letter-spacing:.12em;color:var(--gold)}
#tqr{position:absolute;z-index:3;right:3vw;bottom:3vh;display:flex;align-items:center;gap:1vw;padding:1.2vh;border-radius:1.4vh;background:rgba(5,7,20,.78);transition:opacity .6s}
#tqr svg{width:13vh;height:13vh;border-radius:.6vh}#tqr span{font:700 2.2vh var(--f-body);max-width:12ch;line-height:1.2}#tqr b{display:block;color:var(--gold);font:600 2.8vh var(--f-mono)}

/* ---------- showtimes card ---------- */
#card{display:grid;grid-template-columns:auto 1fr;gap:4vw;align-items:center;padding:5vh 5vw 4vh;overflow:hidden}
#card .bgimg{position:absolute;inset:-6%;background-size:cover;background-position:center;filter:blur(40px) brightness(.36) saturate(1.25);transform:scale(1.1)}
body.lite #card .bgimg{filter:none;opacity:.22}
#card .shade{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 50%,rgba(7,10,28,.15),rgba(7,10,28,.88) 75%)}
#card .poster{position:relative;height:78vh;aspect-ratio:2/3;border-radius:1.2vh;background:#111 center/cover;box-shadow:0 3vh 8vh rgba(0,0,0,.6);animation:drift 14s ease-in-out infinite alternate}
#card .info{position:relative;min-width:0;display:flex;flex-direction:column;gap:2.2vh}
#card.in .info>*{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
#card.in .info>*:nth-child(2){animation-delay:.08s}#card.in .info>*:nth-child(3){animation-delay:.16s}#card.in .info>*:nth-child(4){animation-delay:.24s}#card.in .info>*:nth-child(5){animation-delay:.32s}#card.in .info>*:nth-child(6){animation-delay:.4s}
#card.in .poster{animation:pin 1s cubic-bezier(.2,.8,.2,1) both,drift 14s 1s ease-in-out infinite alternate}
.kicker{font-family:var(--f-mono);font-size:2.2vh;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);display:flex;gap:1.4vw;align-items:center;flex-wrap:wrap}
.kicker .new{background:var(--red);color:#fff;letter-spacing:.15em;padding:.4vh .8vw;border-radius:.6vh;font-weight:600}
.title{font-family:var(--f-display);font-weight:900;font-size:11vh;line-height:.92;text-transform:uppercase;text-wrap:balance;margin:0}
.title.long{font-size:8.5vh}.title.xlong{font-size:6.8vh}
.meta{display:flex;gap:1.4vw;align-items:center;font-size:2.8vh;color:var(--muted);font-weight:600;flex-wrap:wrap}
.meta img{height:5.5vh;width:auto}
.tag{font:700 2.2vh var(--f-body);letter-spacing:.12em;text-transform:uppercase;padding:.5vh .9vw;border-radius:.7vh;border:1px solid var(--line)}
.tag.luxx{color:#ffd98a;font-family:Georgia,serif;letter-spacing:.35em;border-color:rgba(255,217,138,.6)}
.tag.kids{background:var(--gold);color:#2a1800;border-color:var(--gold)}
.tag.relaxed{background:#3d6cf0;border-color:#3d6cf0}.tag.td{border-color:var(--blue);color:#8fd6ff}
.when{font-size:2.5vh;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin-top:.6vh}
.times{display:flex;flex-wrap:wrap;gap:1.2vh}
.times span{position:relative;font-family:var(--f-mono);font-weight:600;font-size:4.2vh;padding:1vh 1.5vw;border-radius:1vh;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:center;line-height:1.05}
.times span small{font:600 1.6vh var(--f-body);letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-top:.3vh}
.times span.lx{border-color:rgba(255,194,61,.7);background:rgba(255,194,61,.12)}.times span.lx small{color:var(--lux)}
.times span.kc{border-color:var(--gold);background:rgba(255,216,74,.18)}
.times span.next{background:var(--gold);color:#1a1030;border-color:var(--gold);box-shadow:0 0 0 .5vh rgba(255,216,74,.25)}.times span.next small{color:#4a3500}
.soonchip{font:700 2.6vh var(--f-body);color:#1a1030;background:var(--green);padding:.8vh 1.2vw;border-radius:99px;align-self:flex-start;animation:pulse 2s ease-in-out infinite}
.soonchip.warm{background:var(--gold)}
.bookrow{display:flex;align-items:center;gap:2vw;margin-top:1vh}
.book{font-size:3vh;font-weight:700}.book b{color:var(--gold)}
.qrbox{display:flex;align-items:center;gap:1.2vw;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:1.4vh;padding:1.2vh 1.4vw 1.2vh 1.2vh}
.qrbox svg{width:14vh;height:14vh;border-radius:.6vh;flex:none}.qrbox span{font-weight:700;font-size:2.3vh;line-height:1.25}.qrbox b{display:block;color:var(--gold);font:600 3vh var(--f-mono)}

/* ---------- Now showing board ---------- */
#board{padding:4.5vh 5vw 3vh;background:radial-gradient(ellipse at 50% -20%,#1d2a6e,var(--bg) 65%);display:flex;flex-direction:column;gap:2.4vh}
.bhead{display:flex;justify-content:space-between;align-items:flex-end;gap:2vw}
.bhead h2{margin:0;font-family:var(--f-display);font-weight:900;font-size:8.5vh;line-height:.9;text-transform:uppercase}
.bhead h2 em{font-style:normal;color:var(--gold)}
.bhead p{margin:.8vh 0 0;font:600 2.4vh var(--f-body);color:var(--muted)}
.bpage{font:600 2vh var(--f-mono);color:var(--muted);letter-spacing:.2em}
.rows{display:flex;flex-direction:column;gap:1vh;flex:1;min-height:0;overflow:hidden}
.brow{display:grid;grid-template-columns:13vh 6vh minmax(0,1fr) auto 12vh 26vh;gap:1.6vw;align-items:center;padding:1.15vh 1.4vw;border-radius:1.2vh;background:var(--panel);border:1px solid var(--line);animation:flip .6s cubic-bezier(.2,.8,.2,1) both}
.brow .t{font:600 4.4vh var(--f-mono);font-variant-numeric:tabular-nums;color:var(--gold)}
.brow .c img{height:4.6vh;display:block}.brow .c span{font:700 2vh var(--f-body);border:2px solid #fff;border-radius:.6vh;padding:.2vh .4vw}
.brow .f{font:800 3.8vh var(--f-display);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .g{display:flex;gap:.6vw}.brow .g .tag{font-size:1.6vh;padding:.3vh .6vw}
.brow .s{font:600 2.2vh var(--f-body);color:var(--muted);text-align:center;line-height:1}.brow .s b{display:block;font:800 4.4vh var(--f-display);color:#fff}
.brow .st{justify-self:end;font:800 2.3vh var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:1vh 1.2vw;border-radius:99px;text-align:center;min-width:22vh}
.st.seat{background:var(--green);color:#062614;animation:pulse 2s ease-in-out infinite}
.st.soon{background:var(--gold);color:#2a1800}
.st.book{background:rgba(31,160,222,.18);color:#8fd6ff;border:1px solid rgba(31,160,222,.6)}
.st.gone{background:transparent;color:var(--muted);border:1px solid var(--line)}
.brow.started{opacity:.55}
.brow.lx{border-color:rgba(255,194,61,.45);background:linear-gradient(90deg,rgba(255,194,61,.1),transparent 60%),var(--panel)}
.bfoot{display:flex;justify-content:space-between;align-items:center;font:600 2.2vh var(--f-body);color:var(--muted)}
.bfoot .qrmini{display:flex;align-items:center;gap:1vw}.bfoot svg{width:10vh;height:10vh;border-radius:.6vh}

/* ---------- promo slides ---------- */
#promo{overflow:hidden;display:grid;place-items:center;padding:6vh 6vw}
#promo .pbg{position:absolute;inset:0}
#promo .pin{position:relative;display:grid;grid-template-columns:1fr auto;gap:5vw;align-items:center;width:100%}
#promo .pin.one{grid-template-columns:1fr}
#promo .pk{font:600 2.6vh var(--f-mono);letter-spacing:.35em;text-transform:uppercase;color:var(--gold)}
#promo h2{margin:1.5vh 0;font:900 13vh/.88 var(--f-display);text-transform:uppercase;text-wrap:balance}
#promo .pl{font:600 3.4vh/1.35 var(--f-body);color:#e9edff;max-width:34ch}
#promo .pl li{margin:.6vh 0}#promo ul{padding-left:3.6vh;margin:1vh 0}
#promo .price{display:inline-grid;place-items:center;text-align:center;width:36vh;height:36vh;border-radius:50%;background:var(--red);color:#fff;font:900 9vh/1 var(--f-display);transform:rotate(-8deg);box-shadow:0 2vh 6vh rgba(0,0,0,.45);animation:pop .9s .3s cubic-bezier(.2,1.4,.4,1) both}
#promo .price small{display:block;font:800 2.4vh var(--f-body);letter-spacing:.18em;margin-bottom:.8vh}
#promo .price.mini{width:22vh;height:22vh;font-size:5.6vh;margin-top:2vh}#promo .price.mini small{font-size:1.7vh}
#promo .prodwrap.cut img{background:none;box-shadow:none;border-radius:0;transform:none;filter:drop-shadow(0 3vh 3.5vh rgba(0,0,0,.5))}
#promo .prodwrap{position:relative;width:62vh;animation:rise 1s .1s cubic-bezier(.2,.8,.2,1) both}#promo .prodwrap img{width:100%;display:block;border-radius:3vh;transform:rotate(2deg);box-shadow:0 3vh 6vh rgba(0,0,0,.5);background:#fff}#promo .prodwrap .price{position:absolute;right:-5vh;top:-6vh;width:28vh;height:28vh;font-size:7vh}
#promo.luxx .price{background:linear-gradient(135deg,#ffd98a,#c9902a);color:#1a1030}
#promo .posters{display:flex;gap:2vw;align-items:flex-end}
#promo .posters div{width:22vh;aspect-ratio:2/3;border-radius:1vh;background:#111 center/cover;box-shadow:0 2vh 5vh rgba(0,0,0,.5);animation:rise .9s cubic-bezier(.2,.8,.2,1) both;position:relative}
#promo .posters div b{position:absolute;left:0;right:0;bottom:-5vh;text-align:center;font:700 2.2vh var(--f-body);color:var(--gold);white-space:nowrap}
#promo .posters div:nth-child(2){animation-delay:.12s}#promo .posters div:nth-child(3){animation-delay:.24s}#promo .posters div:nth-child(4){animation-delay:.36s}
#promo.custom .pbg{background:radial-gradient(circle at 75% 30%,#ffffff14,transparent 45%),linear-gradient(150deg,#1a2160,#0d1240 55%,#05071a)}
#promo.custom.col-red .pbg{background:radial-gradient(circle at 75% 30%,#ff8a6e33,transparent 45%),linear-gradient(150deg,#b3261e,#6b0f12 60%,#2a0507)}
#promo.custom.col-gold .pbg{background:radial-gradient(circle at 75% 30%,#fff3,transparent 45%),linear-gradient(150deg,#d99a1e,#8a5a08 60%,#3a2403)}
#promo.custom.col-purple .pbg{background:radial-gradient(circle at 75% 30%,#d6a8ff33,transparent 45%),linear-gradient(150deg,#4a1d7a,#2a0f4a 60%,#120621)}
#promo.custom.col-green .pbg{background:radial-gradient(circle at 75% 30%,#a8ffcc33,transparent 45%),linear-gradient(150deg,#0f6b46,#073d28 60%,#021a10)}
#promo.custom.col-black .pbg{background:radial-gradient(circle at 75% 30%,#ffc23d1a,transparent 45%),linear-gradient(150deg,#16161c,#08080b)}
#promo.pricebd{padding:0;display:block}#promo.pricebd .pbwrap{position:absolute;inset:0}
#promo.custom .cimg{width:62vh;max-height:62vh;animation:rise 1s .1s cubic-bezier(.2,.8,.2,1) both}#promo.custom .cimg img{width:100%;max-height:62vh;object-fit:contain;display:block;border-radius:2.4vh;box-shadow:0 3vh 6vh rgba(0,0,0,.5)}
#promo .bigqr{background:#fff;padding:2vh;border-radius:2vh;box-shadow:0 2vh 6vh rgba(0,0,0,.45)}#promo .bigqr svg{width:44vh;height:44vh;display:block}
#promo.wed .pbg{background:radial-gradient(circle at 75% 45%,#ff7a3d55,transparent 45%),linear-gradient(135deg,#2a0f3e,#120a2b 55%,#060816)}
#promo.kids .pbg{background:radial-gradient(circle at 20% 20%,#ffd84a44,transparent 40%),linear-gradient(160deg,#0b6bb8,#0a3f86 60%,#071a40)}
#promo.luxx .pbg{background:radial-gradient(circle at 70% 30%,#ffc23d22,transparent 45%),linear-gradient(160deg,#141026,#05040b)}
#promo.luxx h2{font-family:"Playfair Display",Georgia,serif;letter-spacing:.06em;color:#ffd98a}
#promo.scan .pbg{background:radial-gradient(circle at 70% 50%,#1fa0de33,transparent 50%),linear-gradient(135deg,#0b1240,#060816)}
#promo.soon .pbg{background:radial-gradient(ellipse at 50% 0%,#e2452e33,transparent 55%),linear-gradient(180deg,#140a26,#060816)}
#promo.last .pbg{background:radial-gradient(circle at 80% 30%,#e2452e44,transparent 50%),linear-gradient(160deg,#2a0b14,#070a1c)}
#promo.ad{padding:0;background:#000}#promo.ad .pbg{background:#000 center/cover;filter:blur(30px) brightness(.4);transform:scale(1.15)}body.lite #promo.ad .pbg{filter:none;opacity:.25}#promo .adimg{position:relative;max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
#promo .adtag{position:absolute;right:2vw;top:2vh;font:600 1.8vh var(--f-body);color:rgba(255,255,255,.8);background:rgba(0,0,0,.5);padding:.6vh 1vw;border-radius:99px}
#promo.msg .pbg{background:linear-gradient(135deg,#1d2a6e,#070a1c)}

/* ---------- opening / closed screen ---------- */
#hours{display:grid;place-items:center;text-align:center;padding:6vh 6vw;background:radial-gradient(circle at 50% 30%,#1a2150,#070a1c 70%)}
#hours h2{margin:0;font:900 12vh/.9 var(--f-display);text-transform:uppercase}#hours h2 em{font-style:normal;color:var(--gold)}
#hours p{font:600 3vh var(--f-body);color:var(--muted);margin:2vh 0 4vh}
#hours .hl{display:flex;flex-wrap:wrap;justify-content:center;gap:1.4vh 2vw;max-width:150vh}
#hours .hl span{background:var(--panel);border:1px solid var(--line);border-radius:1.2vh;padding:1.2vh 1.6vw;font:700 2.6vh var(--f-body)}#hours .hl b{font-family:var(--f-mono);color:var(--gold);margin-right:.8vw}

/* ---------- live strip: logo · ticker · next show · clock ---------- */
#strip{position:absolute;left:0;right:0;bottom:0;height:calc(var(--strip) + var(--sy));display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:2.2vw;padding:0 calc(2.4vw + var(--sx)) var(--sy);background:#05071a;z-index:5}
#strip::before{content:"";position:absolute;left:0;right:0;top:0;height:.5vh;background:var(--stripe)}
#strip img{height:5.6vh}
.ticker{overflow:hidden;white-space:nowrap;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.ticker div{display:inline-block;padding-left:100%;font:600 2.6vh var(--f-body);color:#e9edff;animation:tick linear infinite}
.ticker i{font-style:normal;color:var(--gold);margin:0 2.4vw}.ticker div{line-height:var(--strip)}.ticker img{height:calc(var(--strip) * .72);width:auto;max-width:11vw;object-fit:contain;vertical-align:middle;margin:0 .9vw 0 0;filter:drop-shadow(0 .4vh .8vh rgba(0,0,0,.6))}.ticker img.tp{height:calc(var(--strip) * .7);border-radius:.5vh}
.nextshow{font:600 2.1vh var(--f-body);color:var(--muted);text-align:right;line-height:1.2;max-width:46vh}.nextshow b{display:block;color:#fff;font:800 2.7vh var(--f-display);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* no clock on the foyer TVs (kept in the page for the timers, but never shown) */
.clock{display:none!important}
#prog{position:absolute;left:0;bottom:var(--sy);height:.45vh;background:rgba(255,255,255,.45);width:0}
body.nostrip #strip{display:none}

/* start screen */
#start{display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 40%,#1a2150,#070a1c 70%);cursor:pointer;z-index:6;bottom:0}
#start h1{font-family:var(--f-display);font-size:9vh;margin:0 0 2vh;text-transform:uppercase}
#start p{font-size:2.6vh;color:var(--muted);max-width:60ch;margin:1vh auto}
#start button{font:700 3vh var(--f-body);padding:2vh 4vw;border-radius:1.2vh;border:0;background:var(--stripe);color:#1a1030;cursor:pointer;margin-top:3vh}
#offline{position:fixed;top:2vh;right:2vw;z-index:7;font:600 1.6vh var(--f-body);color:var(--muted);background:rgba(0,0,0,.6);padding:.6vh 1vw;border-radius:99px}

@keyframes drift{from{transform:scale(1) translateY(0)}to{transform:scale(1.04) translateY(-1vh)}}
@keyframes rise{from{opacity:0;transform:translateY(3vh)}to{opacity:1;transform:none}}
@keyframes pin{from{opacity:0;transform:translateX(-4vw) rotate(-3deg) scale(.96)}to{opacity:1;transform:none}}
@keyframes flip{from{opacity:0;transform:perspective(80vh) rotateX(-70deg)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:rotate(-30deg) scale(.4)}to{opacity:1;transform:rotate(-8deg) scale(1)}}
@keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-100%)}}

/* upright (portrait) TVs */
@media (orientation:portrait){
  :root{--strip:7vh}
  #card{grid-template-columns:1fr;grid-template-rows:auto 1fr;justify-items:center;text-align:center;padding:4vh 5vw}
  #card .poster{height:44vh}#card .info{align-items:center}.meta,.times,.kicker{justify-content:center}.title{font-size:7vh}.title.long{font-size:5.6vh}.title.xlong{font-size:4.6vh}
  .times span{font-size:3vh}.bookrow{flex-direction:column}

<script>
(function(){
const $=s=>document.querySelector(s);
let Q=new URLSearchParams(location.search);
/* child mode (inside the IMC Foyer TV app, tv.html): no settings of its own, always the manager PC's; starts by itself */
const CHILD=Q.get("child")==="1"||(()=>{try{return sessionStorage.getItem("imc-foyer-child")==="1"}catch(e){return false}})();
if(CHILD){try{sessionStorage.setItem("imc-foyer-child","1");sessionStorage.setItem("imc-foyer-auto","1")}catch(e){}}Q.delete("child");
const SITE=Q.get("c")||"enniskillen";
/* new screens: the board every N films (0 = off), promo slides, the live strip, screen numbers, your ticker messages */
/* adverts from the hub: [picture, name, first day, last day, seconds, how often, business] */
const LITE=Q.get("lite")==="1"||(Q.get("lite")!=="0"&&((navigator.hardwareConcurrency||4)<=2||(navigator.deviceMemory||8)<=2));
const RAW="https://raw.githubusercontent.com/popcorn483/imc/main/";
const NI=["enniskillen","ballymena","banbridge","newtownards"];
const SAFE={bbfc:["U","PG","12A","12"],ifco:["G","PG","12A"]};
const RED=/red[\s-]?band|uncensored|unrated|explicit|nsfw|restricted|\b18\+|age[\s-]?restricted/i;
const LOUNGE=Q.get("luxx")==="1";
/* studio trailers (WB360, Disney Box and so on): video files saved on this PC from the hub, plus download links sent in the address as sv=[film key, title, link] */
let STUDIO=[];
function sdb(){return new Promise((res,rej)=>{const r=indexedDB.open("imc-editor",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function sput(k,v){try{const d=await sdb();return await new Promise((res,rej)=>{const t=d.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=()=>res(true);t.onerror=()=>rej(t.error)})}catch(e){return false}}
async function sdel(k){try{const d=await sdb();return await new Promise(res=>{const t=d.transaction("kv","readwrite");t.objectStore("kv").delete(k);t.oncomplete=()=>res(true);t.onerror=()=>res(false)})}catch(e){return false}}
/* ---------- trailer files from a shared Google Drive folder ----------
   The manager drops trailer files (MP4 from WB360, Disney Box and so on) into one Google Drive folder shared as
   "anyone with the link". Every foyer PC lists the folder (Drive API, with the key set in the hub), matches each file to
   a film by its name (or as set in the hub), downloads the ones it needs one at a time into this PC's own storage, plays
   them instead of the YouTube trailer, and deletes them once the film has left the listings. Until a file has finished
   downloading, the YouTube trailer plays. The slot length comes from Drive (the same for every TV), so the TVs stay in step. */
let DRIVE=[],driveAt=0,driveBusy=false,driveMsg="",driveHave={};
try{DRIVE=JSON.parse(localStorage.getItem("imc-gd-list")||"[]");driveHave=JSON.parse(localStorage.getItem("imc-gd-have")||"{}")}catch(e){}
const GD=()=>Q.get("gd")||"",GK=()=>Q.get("gk")||"",GSA=()=>window.IMCDrive&&IMCDrive.saved();   /* an API key (gk, published) or the robot account key kept on this PC only (set up once on the TV app) */
function gmap(){try{const b=(Q.get("gm")||"").replace(/-/g,"+").replace(/_/g,"/");return b?JSON.parse(decodeURIComponent(escape(atob(b+"===".slice((b.length+3)%4))))):{}}catch(e){return{}}}
const dnorm=t=>" "+String(t||"").toLowerCase().replace(/\.(mp4|mov|m4v|webm|mkv)$/,"").replace(/[._]/g," ").replace(/\(.*?\)|\[.*?\]/g," ").replace(/&/g," and ").replace(/[^a-z0-9]+/g," ").replace(/\s+/g," ").trim()+" ";
async function driveList(){if(!GD())return;if(!GK()&&!GSA())return;
  const q=encodeURIComponent(`'${GD()}' in parents and trashed=false`),u=`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,size,mimeType,modifiedTime,videoMediaMetadata(durationMillis))&pageSize=200&key=${encodeURIComponent(GK())}`;
  try{let j;if(!GK()){try{j={files:await IMCDrive.list(GSA(),GD(),nowMs())}}catch(e){driveMsg="Can't read the Google Drive folder: "+e.message;return}}
    else{const r=await fetch(u,{cache:"no-store"});if(!r.ok){driveMsg="Can't read the Google Drive folder (check it's shared and the key in the hub)";return}j=await r.json()}
    DRIVE=(j.files||[]).filter(f=>/^video\//.test(f.mimeType||"")||/\.(mp4|m4v|mov|webm)$/i.test(f.name||"")).map(f=>({id:f.id,name:f.name,size:+f.size||0,dur:Math.round(+(f.videoMediaMetadata&&f.videoMediaMetadata.durationMillis)||0)/1000})).filter(f=>f.dur>5).sort((a,b)=>a.id.localeCompare(b.id));
    driveAt=Date.now();try{localStorage.setItem("imc-gd-list",JSON.stringify(DRIVE))}catch(e){}}catch(e){driveMsg="No internet: using the trailer files already saved"}}
/* which film each Drive file belongs to: the hub's choice, or the longest film title found in the file name */
/* ---------- trailer files from a folder on this PC (e.g. IMC TRAILERS kept in sync by Google Drive for desktop) ----------
   Chosen once on the TV app's set-up screen; Chrome keeps permission to read it ("Allow on every visit").
   Files are matched to films by name and played from the PC's disk. The folder is read again every half hour. */
let LOCAL=[],localFiles=new Map(),localMsg="",localPerm="";
async function localDur(file){const k="imc-lfdur:"+file.name+"|"+file.size+"|"+file.lastModified;try{const c=localStorage.getItem(k);if(c)return+c}catch(e){}
  const v=document.createElement("video"),u=URL.createObjectURL(file);v.preload="metadata";v.muted=true;
  const d=await new Promise(res=>{const t=setTimeout(()=>res(0),15000);v.onloadedmetadata=()=>{clearTimeout(t);res(isFinite(v.duration)?v.duration:0)};v.onerror=()=>{clearTimeout(t);res(0)};v.src=u});
  URL.revokeObjectURL(u);v.removeAttribute("src");if(d>5)try{localStorage.setItem(k,String(Math.round(d*10)/10))}catch(e){}return d}
let localTestDir=null;
async function localScan(){const h=localTestDir||await sget("trailerdir");if(!h||!h.values){LOCAL=[];return}
  try{localPerm=await h.queryPermission({mode:"read"})}catch(e){localPerm="denied"}
  if(localPerm!=="granted"){localMsg="Click the screen once to let this TV read the trailers folder";return}
  const out=[],map=new Map();
  async function walk(dir,depth){for await(const e of dir.values()){if(e.kind==="directory"){if(depth<1)await walk(e,depth+1);continue}
    if(!/\.(mp4|m4v|mov|webm)$/i.test(e.name))continue;try{const f=await e.getFile();if(f.size<1e5)continue;const dur=await localDur(f);if(dur>5){out.push({id:"lf:"+e.name,name:e.name,dur:Math.round(dur*10)/10});map.set("lf:"+e.name,e)}}catch(x){}}}
  try{await walk(h,0);out.sort((a,b)=>a.name.localeCompare(b.name));LOCAL=out;localFiles=map;localMsg=""}catch(e){localMsg="Couldn't read the trailers folder: "+(e.message||e)}}
/* the user's one click (needed for sound after a restart) also re-allows the folder if Chrome asks again */
async function localAllow(){try{const h=await sget("trailerdir");if(h&&h.requestPermission&&(await h.queryPermission({mode:"read"}))!=="granted"){if((await h.requestPermission({mode:"read"}))==="granted"){await localScan();plan=null}}}catch(e){}}
function localAssign(list){const M=Object.fromEntries(Object.entries(gmap()).filter(([k,v])=>!String(v).startsWith("new:"))),out=new Map(),titled=list.map(f=>({f,t:dnorm(cleanTitle(f.title)).trim()})).filter(x=>x.t.length>=3).sort((a,b)=>b.t.length-a.t.length);
  for(const d of LOCAL){const m=M[d.id];if(m==="-")continue;let f=m&&list.find(x=>x.key===m);if(!f){const n=dnorm(d.name),hit=titled.find(x=>n.includes(" "+x.t+" "))||titled.find(x=>x.t.length>=6&&n.replace(/ /g,"").includes(x.t.replace(/ /g,"")));f=hit&&hit.f}if(f&&!out.has(f.key))out.set(f.key,d)}return out}   /* the hub's choice (gm, "lf:<file name>") or the film named in the file name */
function driveAssign(list){const M=gmap(),out=new Map(),titled=list.map(f=>({f,t:dnorm(cleanTitle(f.title)).trim()})).filter(x=>x.t.length>=3).sort((a,b)=>b.t.length-a.t.length);
  for(const d of DRIVE){if(M[d.id]==="-")continue;let f=M[d.id]&&list.find(x=>x.key===M[d.id]);if(!f){const n=dnorm(d.name),hit=titled.find(x=>n.includes(" "+x.t+" "))||titled.find(x=>x.t.length>=6&&n.replace(/ /g,"").includes(x.t.replace(/ /g,"")));f=hit&&hit.f}
    if(f&&!out.has(f.key))out.set(f.key,d)}return out}
async function driveSync(){if(driveBusy||!GD())return;driveBusy=true;
  try{try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
    const A=driveAssign(films()),T=londonNow().date,need=new Map();
    for(const f of films()){const d=A.get(f.key);if(d&&(upcoming(f).length||f.sources&&f.sources.has("soon")||(f.releaseDate||"")>=T))need.set(d.id,d)}
    for(const id of Object.keys(driveHave))if(!need.has(id)){await sdel("gdfile:"+id);delete driveHave[id]}   /* no longer needed: deleted from this PC */
    try{localStorage.setItem("imc-gd-have",JSON.stringify(driveHave))}catch(e){}
    for(const d of need.values()){if(driveHave[d.id])continue;if(netDown())break;driveMsg="Downloading "+d.name+"…";
      try{let b;if(!GK())b=await IMCDrive.download(GSA(),d.id,nowMs());else{const r=await fetch(`https://www.googleapis.com/drive/v3/files/${d.id}?alt=media&key=${encodeURIComponent(GK())}`);if(!r.ok)throw 0;b=await r.blob()}
        if(b.size<1e5)throw 0;if(await sput("gdfile:"+d.id,b)){driveHave[d.id]={name:d.name,size:b.size,at:Date.now()};try{localStorage.setItem("imc-gd-have",JSON.stringify(driveHave))}catch(e){}}}
      catch(e){driveMsg="Couldn't download "+d.name+": will try again later";continue}
      await new Promise(r=>setTimeout(r,4000))}
    if(!/^Couldn't|^Can't/.test(driveMsg))driveMsg=""}finally{driveBusy=false}}
async function sget(k){try{const d=await sdb();return await new Promise((res,rej)=>{const q=d.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){return null}}
async function loadStudio(){const mine=await sget("studio:"+SITE),L=(Array.isArray(mine)?mine:[]).filter(x=>!x.until||x.until>=londonNow().date),urls=new Set(L.map(x=>x.url).filter(Boolean));
