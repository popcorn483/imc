<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IMC Foyer Trailers</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Playfair+Display:wght@700&family=Figtree:wght@500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Full-screen foyer player: a showtimes card, then the film's official trailer, then the next film. Built for TVs, so everything scales with the screen. */
:root{--ink:#fff;--muted:#b9c3e6;--gold:#ffd84a;--blue:#1fa0de;--bg:#070a1c;--stripe:linear-gradient(90deg,#ffd84a,#f39a2b 55%,#e2452e);
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--f-body:"Figtree",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden;cursor:none}
body.pointer{cursor:default}
#stage{position:fixed;inset:0}
.layer{position:absolute;inset:0;transition:opacity .8s ease}
.layer[hidden]{display:block!important;opacity:0;pointer-events:none}
#ident{background:#000}#ident canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#yt,#yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
/* showtimes card */
#card{display:grid;grid-template-columns:auto 1fr;gap:4vw;align-items:center;padding:6vh 6vw 10vh;overflow:hidden}
#card .bgimg{position:absolute;inset:-6%;background-size:cover;background-position:center;filter:blur(40px) brightness(.38) saturate(1.25);transform:scale(1.1)}
#card .shade{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 50%,rgba(7,10,28,.2),rgba(7,10,28,.85) 75%)}
#card .poster{position:relative;height:74vh;aspect-ratio:2/3;border-radius:1.2vh;background:#111 center/cover;box-shadow:0 3vh 8vh rgba(0,0,0,.6);animation:drift 12s ease-in-out infinite alternate}
#card .info{position:relative;min-width:0;display:flex;flex-direction:column;gap:2.4vh}
.kicker{font-family:var(--f-mono);font-size:2.2vh;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.title{font-family:var(--f-display);font-weight:900;font-size:11vh;line-height:.92;text-transform:uppercase;text-wrap:balance;margin:0}
.meta{display:flex;gap:1.6vw;align-items:center;font-size:2.8vh;color:var(--muted);font-weight:600}
.meta img{height:5.5vh;width:auto}
.meta .luxx{color:#ffd98a;font-family:"Georgia",serif;letter-spacing:.35em;border:1px solid rgba(255,217,138,.6);padding:.4vh 1vw}
.when{font-size:2.6vh;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin-top:1vh}
.times{display:flex;flex-wrap:wrap;gap:1.2vh}
.times span{font-family:var(--f-mono);font-size:4.2vh;padding:1vh 1.6vw;border-radius:1vh;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);font-variant-numeric:tabular-nums}
.book{font-size:3vh;font-weight:700;margin-top:1.5vh}
.book b{color:var(--gold)}
#bar{position:absolute;left:0;right:0;bottom:0;height:9vh;display:flex;align-items:center;justify-content:space-between;padding:0 4vw;background:linear-gradient(0deg,rgba(0,0,0,.65),transparent)}
#bar::before{content:"";position:absolute;left:0;right:0;top:0;height:.5vh;background:var(--stripe);opacity:.9}
#bar img{height:6vh}
#bar span{font-family:var(--f-mono);letter-spacing:.25em;font-size:2vh;color:var(--muted);text-transform:uppercase}
#bar .prog{position:absolute;left:0;bottom:0;height:.45vh;background:rgba(255,255,255,.55);width:0}
/* trailer label shown over the video for the first few seconds */
#tlabel{position:absolute;left:4vw;top:4vh;padding:1.2vh 1.6vw;border-radius:1vh;background:rgba(0,0,0,.55);font-family:var(--f-display);font-weight:800;font-size:4vh;text-transform:uppercase;letter-spacing:.04em;transition:opacity .6s}
/* start screen and notices */
#start{display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 40%,#1a2150,#070a1c 70%);cursor:pointer}
#start h1{font-family:var(--f-display);font-size:9vh;margin:0 0 2vh;text-transform:uppercase}
#start p{font-size:2.6vh;color:var(--muted);max-width:60ch;margin:1vh auto}
#start button{font:700 3vh var(--f-body);padding:2vh 4vw;border-radius:1.2vh;border:0;background:var(--stripe);color:#1a1030;cursor:pointer;margin-top:3vh}
#help{position:fixed;right:2vw;bottom:11vh;font-size:1.8vh;color:var(--muted);background:rgba(0,0,0,.6);padding:1vh 1.2vw;border-radius:.8vh;opacity:0;transition:opacity .4s}
body.pointer #help{opacity:1}
@keyframes drift{from{transform:scale(1) translateY(0)}to{transform:scale(1.04) translateY(-1vh)}}
@media (prefers-reduced-motion:reduce){#card .poster{animation:none}.layer{transition:none}}
</style>
</head>
<body>
<div id="stage">
  <div id="yt-wrap" class="layer" hidden><div id="yt"></div><div id="tlabel"></div></div>
  <div id="ident" class="layer" hidden><canvas id="icv" width="1920" height="1080" aria-label="Welcome to IMC"></canvas></div>
  <div id="card" class="layer" hidden><div class="bgimg"></div><div class="shade"></div><div class="poster" role="img"></div>
    <div class="info"><div class="kicker" id="ck"></div><h1 class="title" id="ct"></h1><div class="meta" id="cm"></div><div class="when" id="cw"></div><div class="times" id="cx"></div><div class="book">Book at <b>imc.ie</b></div></div></div>
  <div id="start" class="layer"><div><h1>Foyer trailers</h1><p id="sinfo">Loading the latest listings…</p><button id="go" hidden>Start</button><p style="font-size:2vh">Tip: press F for full screen, → to skip. Leave this tab open; it updates itself every day.</p></div></div>
  <div id="bar"><img src="imc-logo.png" alt="IMC Cinemas"><span id="bname"></span><div class="prog" id="prog"></div></div>
</div>
<div id="help">→ skip · F full screen · M sound on/off</div>
<script>try{if(!window.name)window.name=new URLSearchParams(location.search).get("luxx")==="1"?"imc-lounge":"imc-foyer"}catch(e){}</script>
<script src="ident.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const Q=new URLSearchParams(location.search);
const SITE=Q.get("c")||"enniskillen",MODE=Q.get("mode")||"auto",IDS=(Q.get("ids")||"").split(",").filter(Boolean),OK=new Set((Q.get("ok")||"").split(",").filter(Boolean));
const CARD=Math.max(5,Math.min(30,+Q.get("card")||10)),SOUND=Q.get("sound")!=="0",TRAILERS=Q.get("trailers")!=="0",SOON=Q.get("soon")==="1";
const RAW="https://raw.githubusercontent.com/popcorn483/imc/main/";
const NI=["enniskillen","ballymena","banbridge","newtownards"];
/* foyer-safe certificates: trailers for these films are made for all audiences */
const SAFE={bbfc:["U","PG","12A","12"],ifco:["G","PG","12A"]};
const RED=/red[\s-]?band|uncensored|unrated|explicit|nsfw|restricted|\b18\+|age[\s-]?restricted/i;
 /* welcome videos made in the hub travel in the link, since the TV can't see the hub's saved settings */
const LOUNGE=Q.get("luxx")==="1";
/* trailers you linked yourself in the hub, for films whose imc.ie trailer is missing or unsuitable */
const MYTR=Object.fromEntries((Q.get("tl")||"").split("|").map(x=>x.split("~")).filter(x=>x.length===2&&/^[\w-]{11}$/.test(x[1])));
const WEL=(window.IMCIdent?IMCIdent.decode(Q.get("w")||""):[]).filter(w=>!LOUNGE||w.brand==="luxx"),WF=Q.get("wf")||(WEL.length?"r":"0");
let since=0,justIdent=false,lastIdent=-1,idAssets=null,idRaf=0;
const newGap=()=>WF==="r"?2+Math.floor(Math.random()*3):Math.max(1,+WF||1);let gap=newGap();
let D=null,T={},base="",queue=[],qi=-1,player=null,timer=null,ytReady=null,muted=!SOUND,lastLoad=0;

function londonNow(){const p={};for(const x of new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/London",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date()))p[x.type]=x.value;return{date:`${p.year}-${p.month}-${p.day}`,hm:`${p.hour}:${p.minute}`}}
async function getJson(path){for(const u of[RAW+path+"?ts="+Date.now(),path]){try{const r=await fetch(u,{cache:"no-store"});if(r.ok){const j=await r.json();j._base=u.startsWith(RAW)?RAW:"";return j}}catch(e){}}return null}
const asset=p=>!p?"":/^https?:/.test(p)?p:base+p;
const ytId=u=>{const m=/(?:v=|youtu\.be\/|embed\/)([\w-]{6,})/.exec(u||"");return m?m[1]:null};
/* every film with its upcoming sessions, merged across the importer's lists */
function films(){const m=new Map();
  for(const[src,list]of[["today",D.today||[]],["soon",D.comingSoon||[]],["kids",D.kidsClub||[]],["luxx",D.luxx||[]],...(D.days||[]).map(d=>["day",d.films||[]])])
    for(const f of list){if(!f.title)continue;const k=(f.slug||f.title.toLowerCase())+(f.luxx?"|l":"");const p=m.get(k)||{...f,key:k,sources:new Set(),sessions:[]};p.sources.add(src);
      for(const s of f.sessions||[])if(!p.sessions.some(x=>x.date===s.date&&x.time===s.time))p.sessions.push(s);for(const key of["poster","posterFile","cert","certIcon","certSystem","runtime","trailer","releaseDate"])p[key]=p[key]||f[key];m.set(k,p)}
  /* one entry per film: the LUXX listing shares the standard one's trailer */
  const out=new Map();for(const f of m.values()){const k=f.slug||f.title.toLowerCase(),o=out.get(k);if(!o)out.set(k,{...f,key:k,luxxToo:!!f.luxx,luxxS:f.luxx?[...f.sessions]:[]});else{o.luxxToo=o.luxxToo||!!f.luxx;if(f.luxx)for(const s of f.sessions)if(!o.luxxS.some(x=>x.date===s.date&&x.time===s.time))o.luxxS.push(s);for(const s of f.sessions)if(!o.sessions.some(x=>x.date===s.date&&x.time===s.time))o.sessions.push(s)}}
  for(const f of out.values())if(MYTR[f.key]){f.trailer="https://www.youtube.com/watch?v="+MYTR[f.key];f.mine=true}
  return[...out.values()]}
function safety(f){const t=f.mine?{}:T[f.trailer]||{};const sys=f.certSystem||(NI.includes(SITE)?"bbfc":"ifco"),c=String(f.cert||"").toUpperCase();
  if(!f.trailer||!ytId(f.trailer))return{ok:false,why:"no trailer"};if(t.unavailable)return{ok:false,why:"trailer unavailable"};
  if(t.red||RED.test(t.title||""))return{ok:false,why:"red-band trailer"};
  if(!c||c==="TBC")return OK.has(f.key)?{ok:true}:{ok:false,review:true,why:"no certificate yet"};
  return(SAFE[sys]||SAFE.bbfc).includes(c)?{ok:true}:{ok:false,why:"rated "+c}}
function upcoming(f){const n=londonNow();return f.sessions.filter(s=>s.date&&(s.date>n.date||(s.date===n.date&&s.time>n.hm))).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))}
function buildQueue(){const n=londonNow(),all=LOUNGE?films().filter(f=>f.luxxToo&&f.luxxS.length).map(f=>({...f,sessions:f.luxxS})):films(),in7=new Date(Date.now()+7*864e5).toLocaleDateString("en-CA",{timeZone:"Europe/London"});
  let list=MODE==="pick"&&IDS.length?IDS.map(k=>all.find(f=>f.key===k)).filter(Boolean):all.filter(f=>{const u=upcoming(f);return u.length&&u[0].date<=in7||(SOON&&f.sources.has("soon"))});
  /* special screenings (sensory, fancy dress…) share their film's trailer: show each trailer once */
  const nt=t=>String(t||"").toLowerCase().replace(/^(sensory|autism friendly|parent (and|&) baby)[:\s-]*/,"").replace(/\s+-\s+.*$|\(.*?\)/g,"").replace(/[^a-z0-9]+/g," ").trim();
  list=list.filter(f=>safety(f).ok).filter((f,i,a)=>a.findIndex(x=>x.trailer===f.trailer||nt(x.title)===nt(f.title))===i);
  list.sort((a,b)=>{const ua=upcoming(a)[0],ub=upcoming(b)[0];return(ua?ua.date+ua.time:"9"+(a.releaseDate||"")).localeCompare(ub?ub.date+ub.time:"9"+(b.releaseDate||""))});
  return list}
function fmtDay(d){return new Date(d+"T12:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})}
function showCard(f){const u=upcoming(f),n=londonNow(),day=u[0]?u[0].date:null,times=day?u.filter(s=>s.date===day).map(s=>s.time):[];
  const poster=asset(f.posterFile)||f.poster;$("#card .poster").style.backgroundImage=`url("${poster}")`;$("#card .bgimg").style.backgroundImage=`url("${poster}")`;$("#card .poster").setAttribute("aria-label",f.title+" poster");
  $("#ck").textContent=day?(day===n.date?"Showing today":"Showing "+fmtDay(day)):f.releaseDate?"Coming "+fmtDay(f.releaseDate):"Coming soon";
  $("#ct").textContent=f.title;
  const icon=f.certIcon?`<img src="${asset(f.certIcon)}" alt="Rated ${f.cert}">`:f.cert?`<span>${f.cert}</span>`:"";
  $("#cm").innerHTML=icon+(f.runtime?`<span>${f.runtime} min</span>`:"")+(f.luxxToo?`<span class="luxx">LUXX</span>`:"");
  $("#cw").textContent=times.length>1?"Showtimes":times.length?"Showtime":"";
  $("#cx").innerHTML=times.slice(0,8).map(t=>`<span>${t}</span>`).join("");
  show("card")}
function show(id){if(id!=="ident")cancelAnimationFrame(idRaf);for(const l of["card","yt-wrap","start","ident"])$("#"+(l)).hidden=l!==id}
function progress(sec){const p=$("#prog");p.style.transition="none";p.style.width="0";requestAnimationFrame(()=>{p.style.transition=`width ${sec}s linear`;p.style.width="100%"})}
function loadYT(){if(ytReady)return ytReady;ytReady=new Promise(res=>{window.onYouTubeIframeAPIReady=()=>res(true);const s=document.createElement("script");s.src="https://www.youtube.com/iframe_api";s.onerror=()=>res(false);document.head.appendChild(s);setTimeout(()=>res(!!window.YT&&!!window.YT.Player),12000)});return ytReady}
async function next(){clearTimeout(timer);
  if(Date.now()-lastLoad>6*3600e3)await load();
  if(!queue.length){show("start");$("#sinfo").textContent="No foyer-safe trailers to show right now. Checking again in 10 minutes.";timer=setTimeout(async()=>{await load();next()},600e3);return}
  /* now and then, a welcome video between films */
  if(WEL.length&&WF!=="0"&&!justIdent&&qi>=0&&(qi%2===1||!TRAILERS)){since++;if(since>=gap){since=0;gap=newGap();justIdent=true;return playIdent()}}
  justIdent=false;
  qi=(qi+1)%(queue.length*2);if(!TRAILERS&&qi%2)qi=(qi+1)%(queue.length*2);const f=queue[Math.floor(qi/2)%queue.length];
  if(qi%2===0||!TRAILERS){showCard(f);progress(CARD);timer=setTimeout(next,CARD*1000);return}
  const ok=await loadYT();if(!ok){showCard(f);progress(CARD);timer=setTimeout(next,CARD*1000);return}
  const id=ytId(f.trailer);$("#tlabel").textContent=f.title;$("#tlabel").style.opacity=1;setTimeout(()=>$("#tlabel").style.opacity=0,5000);
  show("yt-wrap");progress(0.01);
  let started=false;const guard=setTimeout(()=>{if(!started)next()},15000),cap=setTimeout(()=>next(),5*60e3);
  const done=()=>{clearTimeout(guard);clearTimeout(cap)};
  if(player&&player.loadVideoById){player.loadVideoById(id);if(muted)player.mute();else player.unMute()}
  else player=new YT.Player("yt",{videoId:id,playerVars:{autoplay:1,controls:0,rel:0,modestbranding:1,playsinline:1,iv_load_policy:3,disablekb:1,mute:muted?1:0},
    events:{onReady:e=>{if(muted)e.target.mute();e.target.playVideo()},onStateChange:e=>{if(e.data===1)started=true;if(e.data===0){done();next()}},onError:()=>{done();next()}}});
  player._done=done}
async function playIdent(){try{if(player&&player.stopVideo)player.stopVideo()}catch(e){}
  if(!idAssets)idAssets=await IMCIdent.loadAssets("");let i=Math.floor(Math.random()*WEL.length);if(WEL.length>1&&i===lastIdent)i=(i+1)%WEL.length;lastIdent=i;
  const w=WEL[i],cv=$("#icv"),c=cv.getContext("2d"),secs=w.dur||8,t0=performance.now();show("ident");progress(secs);
  const step=()=>{const t=Math.min(1,(performance.now()-t0)/(secs*1000));IMCIdent.draw(c,1920,1080,t,w,idAssets);if(t<1)idRaf=requestAnimationFrame(step)};step();
  timer=setTimeout(next,secs*1000+150)}
async function load(){D=await getJson(SITE==="enniskillen"?"data/imc.json":"data/cinemas/"+SITE+".json");T=(await getJson("data/trailers.json"))||{};base=D?D._base:"";lastLoad=Date.now();
  if(!D){queue=[];return}queue=buildQueue();$("#bname").textContent=(D.cinema||"IMC")+(LOUNGE?" · LUXX":"")+" · Book at imc.ie";document.title=(D.cinema||"IMC")+(LOUNGE?" LUXX lounge":" foyer trailers");if(LOUNGE){const h=$("#start h1");if(h)h.textContent="LUXX lounge"}}
async function start(){if(SOUND){muted=false}show("card");qi=-1;next()}
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"){if(player&&player._done)player._done();next()}if(e.key==="f"||e.key==="F"){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}
  if(e.key==="m"||e.key==="M"){muted=!muted;if(player&&player.mute){muted?player.mute():player.unMute()}}});
let mv;document.addEventListener("mousemove",()=>{document.body.classList.add("pointer");clearTimeout(mv);mv=setTimeout(()=>document.body.classList.remove("pointer"),2500)});
/* refresh once a day before opening so times are right */
setInterval(()=>{const n=londonNow();if(n.hm==="05:00")location.reload()},60e3);
(async()=>{await load();if(!D){$("#sinfo").textContent="Couldn't load the listings. Check the internet connection; retrying in a minute.";setTimeout(()=>location.reload(),60e3);return}
  const n=queue.length;$("#sinfo").textContent=n?`${n} foyer-safe film${n>1?"s":""} for ${D.cinema}. ${TRAILERS?"Each trailer plays after its showtimes card.":"Showtimes cards only."}${SOUND?" Click Start to play with sound.":""}`:"No foyer-safe trailers to show right now.";
  $("#go").hidden=false;$("#go").focus();$("#go").onclick=start;
  if(!SOUND)start()})();
})();
</script>
</body>
</html>
