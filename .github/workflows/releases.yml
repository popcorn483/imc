name: UK release calendar

on:
  schedule:
    - cron: "41 5 * * *"
  push:
    paths: [tools/releases.mjs, .github/workflows/releases.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: releases
  cancel-in-progress: false

jobs:
  releases:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock cheerio@1.0.0
      - run: node tools/releases.mjs
      - name: Commit
        run: |
          git config user.name "imc-importer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update UK release calendar"
          git pull --rebase -X theirs
          git push
