name: Check the foyer PC setup script

on:
  push:
    paths: [setup/IMC-Foyer-PC-Setup.bat, setup/IMC-Convert-Trailers.bat, .github/workflows/test-setup.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Parse and test
        shell: powershell
        run: |
          $out = @()
          $raw = [IO.File]::ReadAllText("setup\IMC-Foyer-PC-Setup.bat")
          $errs = $null; [void][System.Management.Automation.Language.Parser]::ParseInput($raw, [ref]$null, [ref]$errs)
          $out += "Main script parse errors: $($errs.Count)"; $errs | ForEach-Object { $out += "  " + $_.Message + " @ line " + $_.Extent.StartLineNumber }
          $m = [regex]::Match($raw, "\`$sync = @'\r?\n(.*?)\r?\n'@", "Singleline"); $sync = $m.Groups[1].Value
          $errs2 = $null; [void][System.Management.Automation.Language.Parser]::ParseInput($sync, [ref]$null, [ref]$errs2)
          $out += "Sync script parse errors: $($errs2.Count)"; $errs2 | ForEach-Object { $out += "  " + $_.Message }
          # run the sync against a pretend Drive folder
          New-Item -ItemType Directory -Force "C:\ProgramData\IMC", "D:\My Drive\IMC TRAILERS" | Out-Null
          Set-Content "C:\ProgramData\IMC\sync-trailers.ps1" $sync -Encoding UTF8
          [IO.File]::WriteAllBytes("D:\My Drive\IMC TRAILERS\Hexed_TLR.mp4", (New-Object byte[] 1048576))
          [IO.File]::WriteAllBytes("D:\My Drive\IMC TRAILERS\Klara_TLR.mp4", (New-Object byte[] 2048))
          Set-Content "D:\My Drive\IMC TRAILERS\notes.txt" "x"
          & powershell -NoProfile -ExecutionPolicy Bypass -File C:\ProgramData\IMC\sync-trailers.ps1
          $out += "After first run: " + ((Get-ChildItem "C:\IMC TRAILERS" | ForEach-Object Name) -join ", ")
          Remove-Item "D:\My Drive\IMC TRAILERS\Klara_TLR.mp4"
          & powershell -NoProfile -ExecutionPolicy Bypass -File C:\ProgramData\IMC\sync-trailers.ps1
          $out += "After delete: " + ((Get-ChildItem "C:\IMC TRAILERS" | ForEach-Object Name) -join ", ")
          Get-ChildItem "D:\My Drive\IMC TRAILERS" -File | Remove-Item
          & powershell -NoProfile -ExecutionPolicy Bypass -File C:\ProgramData\IMC\sync-trailers.ps1
          $out += "Drive empty, first check: " + ((Get-ChildItem "C:\IMC TRAILERS" | ForEach-Object Name) -join ", ")
          & powershell -NoProfile -ExecutionPolicy Bypass -File C:\ProgramData\IMC\sync-trailers.ps1
          $out += "Drive empty, second check: " + ((Get-ChildItem "C:\IMC TRAILERS" | ForEach-Object Name) -join ", ")
          $out += "Log:"; $out += (Get-Content C:\ProgramData\IMC\sync.log)
          # the scheduled task part, as this user
          try {
            $me = [Security.Principal.WindowsIdentity]::GetCurrent().Name
            $a = New-ScheduledTaskAction -Execute "wscript.exe" -Argument "`"C:\ProgramData\IMC\sync-hidden.vbs`""
            $e = New-ScheduledTaskTrigger -Once -At (Get-Date).AddMinutes(2) -RepetitionInterval (New-TimeSpan -Minutes 10) -RepetitionDuration (New-TimeSpan -Days 3650)
            $l = New-ScheduledTaskTrigger -AtLogOn -User $me
            $w = New-ScheduledTaskPrincipal -UserId $me -LogonType Interactive -RunLevel Limited
            $o = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -StartWhenAvailable -MultipleInstances IgnoreNew -ExecutionTimeLimit (New-TimeSpan -Hours 2)
            Register-ScheduledTask -TaskName "IMC trailers sync" -Action $a -Trigger @($e, $l) -Principal $w -Settings $o -Force | Out-Null
            $out += "Scheduled task: OK"
          } catch { $out += "Scheduled task: FAILED " + $_.Exception.Message }
          # the batch-file start-up: does cmd hand over to PowerShell?
          $boot = ($raw -split "#>")[0] + "#>`r`n" + 'Write-Host ("BOOT OK mode=" + $env:IMC_MODE)' + "`r`n"
          [IO.File]::WriteAllText("$env:TEMP\boot.bat", $boot)
          try { $ErrorActionPreference = "Continue"; $r = cmd.exe /c "`"$env:TEMP\boot.bat`" elevated" 2>&1 | Out-String; $out += "Batch start-up: " + $r.Trim() } catch { $out += "Batch start-up failed: " + $_.Exception.Message }
          $out | Set-Content setup\test-result.txt
          $out
      - name: Test the trailer converter
        shell: powershell
        run: |
          $o = @()
          $raw = [IO.File]::ReadAllText("setup\IMC-Convert-Trailers.bat")
          $errs = $null; [void][System.Management.Automation.Language.Parser]::ParseInput($raw, [ref]$null, [ref]$errs)
          $o += "Converter parse errors: $($errs.Count)"; $errs | ForEach-Object { $o += "  " + $_.Message + " @ line " + $_.Extent.StartLineNumber }
          $d = "D:\conv\IMC TRAILERS"; New-Item -ItemType Directory -Force $d, "$d\November" | Out-Null
          $env:IMC_NOPAUSE = "1"; $env:IMC_NOASK = "1"
          $ErrorActionPreference = "Continue"
          $r = cmd.exe /c "`"$PWD\setup\IMC-Convert-Trailers.bat`" `"$d`"" 2>&1 | Out-String
          $o += "First run (empty folder, downloads FFmpeg):"; $o += ($r -split "`n" | Where-Object { $_.Trim() } | Select-Object -Last 4)
          $ff = (Get-ChildItem C:\ProgramData\IMC\ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName
          $fp = Join-Path (Split-Path $ff) "ffprobe.exe"
          $o += "FFmpeg: " + $(if ($ff) { "found" } else { "MISSING" })
          & $ff -hide_banner -loglevel error -f lavfi -i testsrc=size=720x576:rate=25 -f lavfi -i sine=frequency=440 -t 6 -c:v mpeg2video -b:v 4M -flags +ilme+ildct -c:a mp2 "$d\Coco.mpg"
          & $ff -hide_banner -loglevel error -f lavfi -i testsrc=size=1280x720:rate=24 -f lavfi -i sine -t 4 -c:v mjpeg -c:a pcm_s16le "$d\November\Dune 3.mov"
          & $ff -hide_banner -loglevel error -f lavfi -i testsrc=size=1280x720:rate=24 -f lavfi -i sine -t 3 -c:v libx264 -c:a aac "$d\Already fine.mp4"
          & $ff -hide_banner -loglevel error -f lavfi -i testsrc=size=640x360:rate=25 -t 4 -c:v wmv2 -b:v 2M "$d\Shrek 5.wmv"
          $r = cmd.exe /c "`"$PWD\setup\IMC-Convert-Trailers.bat`" `"$d`"" 2>&1 | Out-String
          $o += "Second run:"; $o += ($r -split "`n" | Where-Object { $_.Trim() -and $_ -notmatch "^frame=" } | ForEach-Object { $_.TrimEnd() })
          # automatic mode: switch on, then a new trailer arrives and the background run converts it
          $env:IMC_DIR = $d
          $r = cmd.exe /c "`"$PWD\setup\IMC-Convert-Trailers.bat`" /install" 2>&1 | Out-String; $o += "Install: " + $r.Trim()
          $t = Get-ScheduledTask -TaskName "IMC convert trailers" -ErrorAction SilentlyContinue
          $o += "Scheduled task: " + $(if ($t) { "registered, runs " + $t.Actions[0].Execute + " " + $t.Actions[0].Arguments } else { "MISSING" })
          $o += "Background script: " + ((Get-Content "C:\ProgramData\IMC\convert-hidden.vbs") -join " / ")
          & $ff -hide_banner -loglevel error -f lavfi -i testsrc=size=720x576:rate=25 -f lavfi -i sine -t 5 -c:v mpeg2video -b:v 4M -c:a mp2 "$d\George Michael.mpg"
          (Get-Item "$d\George Michael.mpg").LastWriteTime = (Get-Date).AddMinutes(-10)
          & $ff -hide_banner -loglevel error -f lavfi -i testsrc=size=720x576:rate=25 -t 5 -c:v mpeg2video -b:v 4M "$d\Just arrived.mpg"
          Start-Process wscript.exe -ArgumentList "`"C:\ProgramData\IMC\convert-hidden.vbs`"" -Wait
          $o += "convert.log:"; $o += (Get-Content "C:\ProgramData\IMC\convert.log")
          $r = cmd.exe /c "`"$PWD\setup\IMC-Convert-Trailers.bat`" /off" 2>&1 | Out-String; $o += "Off: " + $r.Trim() + " task now " + $(if (Get-ScheduledTask -TaskName "IMC convert trailers" -ErrorAction SilentlyContinue) { "STILL THERE" } else { "gone" })
          # already converted once (on Google Drive the old file couldn't be removed) + repeated copies from the old version
          & $ff -hide_banner -loglevel error -f lavfi -i testsrc=size=1280x720:rate=24 -f lavfi -i sine -t 4 -c:v libx264 -b:v 3M -c:a aac "$d\Hexed.mp4"; (Get-Item "$d\Hexed.mp4").LastWriteTime = (Get-Date).AddMinutes(-10)
          & $ff -hide_banner -loglevel error -f lavfi -i testsrc=size=720x576:rate=25 -t 3 -c:v mpeg2video -b:v 4M "$d\Hexed.mpg"
          Copy-Item "$d\Coco.mp4" "$d\Coco (foyer) (foyer).mp4"
          $r = cmd.exe /c "`"$PWD\setup\IMC-Convert-Trailers.bat`" `"$d`"" 2>&1 | Out-String
          $o += "Tidy run:"; $o += ($r -split "`n" | Where-Object { $_ -match "Already|repeated|half-made|Nothing|to convert" } | ForEach-Object { $_.TrimEnd() })
          $o += "Files now:"
          foreach ($f in Get-ChildItem $d -File -Recurse) { $c = & $fp -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1:nk=1 $f.FullName; $a = & $fp -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1:nk=1 $f.FullName; $o += "  " + $f.FullName.Substring($d.Length + 1) + "  video=" + $c + " audio=" + $a }
          $o | Set-Content setup\convert-test.txt
          $o
      - name: Save the result
        shell: bash
        run: |
          git config user.name "imc-importer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add setup/test-result.txt setup/convert-test.txt
          git commit -m "Setup script check result" || exit 0
          git pull --rebase -X theirs && git push
